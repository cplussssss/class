<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FaithFlow QA 練習室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1612;
    --parchment: #f5f0e8;
    --warm: #c8a96e;
    --warm-light: #e8d5a8;
    --warm-dim: #8c6d3f;
    --ash: #6b6258;
    --card-bg: #faf7f2;
    --border: #ddd5c0;
    --red: #b84c3a;
    --green: #3a7d5a;
    --glow: rgba(200, 169, 110, 0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--parchment);
    background-image:
      radial-gradient(ellipse at 20% 0%, rgba(200,169,110,0.12) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 100%, rgba(140,109,63,0.08) 0%, transparent 60%);
    color: var(--ink);
    font-family: 'Noto Sans TC', sans-serif;
    min-height: 100vh;
    padding: 2rem 1rem 4rem;
  }

  /* ── 頁首 ─────────────────────────────────── */
  header {
    text-align: center;
    margin-bottom: 2.5rem;
    position: relative;
  }
  header::after {
    content: '';
    display: block;
    width: 80px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--warm), transparent);
    margin: 1rem auto 0;
  }
  .title-en {
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.22em;
    color: var(--warm-dim);
    text-transform: uppercase;
    margin-bottom: 0.4rem;
  }
  h1 {
    font-family: 'Noto Serif TC', serif;
    font-size: clamp(1.6rem, 4vw, 2.2rem);
    font-weight: 600;
    color: var(--ink);
    line-height: 1.3;
  }
  .subtitle {
    font-size: 0.82rem;
    color: var(--ash);
    margin-top: 0.5rem;
    font-weight: 300;
    letter-spacing: 0.04em;
  }

  /* ── 主容器 ───────────────────────────────── */
  .container {
    max-width: 760px;
    margin: 0 auto;
  }

  /* ── 進度條 ───────────────────────────────── */
  .progress-bar {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
  }
  .progress-track {
    flex: 1;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--warm-dim), var(--warm));
    border-radius: 2px;
    transition: width 0.5s ease;
  }
  .progress-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    color: var(--ash);
    white-space: nowrap;
  }

  /* ── 題目卡片 ─────────────────────────────── */
  .question-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 2rem 2rem 1.5rem;
    margin-bottom: 1.25rem;
    position: relative;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05);
    animation: slideIn 0.35s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .q-meta {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 1rem;
  }
  .q-num {
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    color: var(--warm-dim);
    background: var(--warm-light);
    padding: 2px 8px;
    border-radius: 4px;
  }
  .q-category {
    font-size: 0.72rem;
    color: var(--ash);
    letter-spacing: 0.05em;
  }
  .q-difficulty {
    margin-left: auto;
    font-size: 0.68rem;
    padding: 2px 8px;
    border-radius: 4px;
    font-family: 'DM Mono', monospace;
  }
  .diff-hard { background: #fae8e5; color: var(--red); }
  .diff-mid  { background: #faf0e0; color: #8c6820; }
  .diff-easy { background: #e8f5ee; color: var(--green); }

  .q-text {
    font-family: 'Noto Serif TC', serif;
    font-size: 1.05rem;
    line-height: 1.8;
    color: var(--ink);
  }

  /* ── 答題區 ───────────────────────────────── */
  .answer-area {
    margin-bottom: 1.25rem;
  }
  .answer-area label {
    display: block;
    font-size: 0.75rem;
    color: var(--ash);
    letter-spacing: 0.08em;
    margin-bottom: 0.5rem;
  }
  textarea {
    width: 100%;
    min-height: 120px;
    padding: 0.9rem 1rem;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 0.92rem;
    line-height: 1.7;
    color: var(--ink);
    resize: vertical;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }
  textarea:focus {
    border-color: var(--warm);
    box-shadow: 0 0 0 3px var(--glow);
  }

  /* ── 按鈕列 ───────────────────────────────── */
  .btn-row {
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
    margin-bottom: 1.5rem;
  }
  button {
    cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 0.85rem;
    border: none;
    border-radius: 7px;
    padding: 0.6rem 1.2rem;
    transition: all 0.18s ease;
    letter-spacing: 0.03em;
  }
  .btn-primary {
    background: var(--ink);
    color: var(--parchment);
    font-weight: 500;
  }
  .btn-primary:hover { background: #2e2720; transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }

  .btn-secondary {
    background: transparent;
    color: var(--warm-dim);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { border-color: var(--warm); color: var(--warm-dim); background: var(--glow); }

  .btn-ai {
    background: linear-gradient(135deg, var(--warm-dim), var(--warm));
    color: #fff;
    font-weight: 500;
    margin-left: auto;
  }
  .btn-ai:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .btn-ai:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* ── AI 回饋卡 ────────────────────────────── */
  .feedback-card {
    background: #fff;
    border: 1px solid var(--warm-light);
    border-left: 3px solid var(--warm);
    border-radius: 8px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 1.5rem;
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; } to { opacity: 1; }
  }
  .feedback-header {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.75rem;
  }
  .feedback-icon {
    width: 20px; height: 20px;
    background: var(--warm);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: #fff;
  }
  .feedback-label {
    font-size: 0.72rem;
    font-family: 'DM Mono', monospace;
    color: var(--warm-dim);
    letter-spacing: 0.1em;
  }
  .feedback-text {
    font-size: 0.9rem;
    line-height: 1.75;
    color: var(--ink);
    white-space: pre-wrap;
  }

  /* ── AI 出題卡 ────────────────────────────── */
  .ai-question-card {
    background: linear-gradient(135deg, #fdf8f0, #f5ede0);
    border: 1px solid var(--warm-light);
    border-radius: 12px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
    animation: slideIn 0.35s ease;
  }
  .ai-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    color: var(--warm-dim);
    letter-spacing: 0.12em;
    background: var(--warm-light);
    padding: 2px 8px;
    border-radius: 4px;
    margin-bottom: 0.75rem;
  }
  .ai-badge::before {
    content: '✦';
    font-size: 8px;
  }
  .ai-q-text {
    font-family: 'Noto Serif TC', serif;
    font-size: 1rem;
    line-height: 1.8;
    color: var(--ink);
  }

  /* ── 導覽 ─────────────────────────────────── */
  .nav-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 0.5rem;
  }
  .nav-dots {
    display: flex;
    gap: 6px;
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--border);
    transition: background 0.2s, transform 0.2s;
    cursor: pointer;
  }
  .dot.active { background: var(--warm); transform: scale(1.3); }
  .dot.done   { background: var(--warm-dim); }

  /* ── 載入動畫 ─────────────────────────────── */
  .loading {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--ash);
    font-size: 0.82rem;
    padding: 0.75rem 0;
  }
  .spinner {
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--warm);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── 完成畫面 ─────────────────────────────── */
  .complete-screen {
    text-align: center;
    padding: 3rem 1rem;
    animation: fadeIn 0.5s ease;
  }
  .complete-icon {
    font-size: 3rem;
    margin-bottom: 1rem;
  }
  .complete-screen h2 {
    font-family: 'Noto Serif TC', serif;
    font-size: 1.5rem;
    margin-bottom: 0.5rem;
  }
  .complete-screen p {
    color: var(--ash);
    font-size: 0.9rem;
    margin-bottom: 1.5rem;
  }

  /* ── RWD ──────────────────────────────────── */
  @media (max-width: 540px) {
    .question-card { padding: 1.25rem; }
    .btn-ai { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>

<header>
  <div class="title-en">Faith Flow · Capstone Practice</div>
  <h1>專題口試練習室</h1>
  <p class="subtitle">天好運 FaithFlow — 第43屆輔大資管專題</p>
</header>

<div class="container" id="app"></div>

<script>
// ═══════════════════════════════════════════════════════
//  設定
// ═══════════════════════════════════════════════════════
const WORKER_URL = 'https://focus.sijialai1473.workers.dev/quiz';

const SYSTEM_CONTEXT = `你是輔仁大學資訊管理學系的專題評審教授。
學生的專題名稱是「天好運 FaithFlow」，這是一個針對天主教徒的宗教數位化系統，
功能包含：集典冊（日記）、有答大師（AI問答）、活水泉源（AI每日抽卡啟發）、
心靈營火（社群）、朝聖之地（地圖與360環景）。
技術架構：React Native、Firebase + PostgreSQL、Cloudflare R2、
Gemini/Qwen AI、Magisterium API、Deepgram 語音辨識。

你的評審風格是嚴謹但友善，會針對資管領域核心能力提問：
系統分析、資料庫設計、AI應用、資安、商業可行性。`;

// ═══════════════════════════════════════════════════════
//  寫死題庫
// ═══════════════════════════════════════════════════════
const PRESET_QUESTIONS = [
  {
    id: 1,
    category: '系統定位',
    difficulty: 'mid',
    text: '你們的目標使用者是「天主教徒」，但組內沒有人是教徒——你們如何確保需求分析的準確性？訪談了幾位受訪者？涵蓋哪些年齡層？',
  },
  {
    id: 2,
    category: 'AI 技術',
    difficulty: 'hard',
    text: '「有答大師」使用了 Magisterium API 與 Qwen2.5-14B，請說明這兩個模型在系統中的分工，以及如何防範 AI 幻覺（hallucination）輸出錯誤的宗教內容？',
  },
  {
    id: 3,
    category: 'AI 技術',
    difficulty: 'hard',
    text: '「集典冊」的每週 AI 總結使用哪種技術？若使用者日記極短或包含高度個人隱私，AI 的處理策略為何？如何衡量摘要品質？',
  },
  {
    id: 4,
    category: '資料庫設計',
    difficulty: 'hard',
    text: '你們同時採用 Firebase 與 PostgreSQL 雙資料庫架構，資料如何分流儲存？邊界如何定義？兩者之間的同步一致性怎麼維護？',
  },
  {
    id: 5,
    category: '資訊安全',
    difficulty: 'hard',
    text: '使用者的日記與祈禱內容屬於高敏感個人資料，系統的資安設計為何？資料加密方式、存取控制（ACL）機制，以及是否符合個資法規範？',
  },
  {
    id: 6,
    category: '需求規格',
    difficulty: 'mid',
    text: '你們的使用者故事缺少非功能性需求（NFR），例如「有答大師」AI 回應的可接受延遲是幾秒？效能基準如何訂定？如何測試？',
  },
  {
    id: 7,
    category: '競品分析',
    difficulty: 'hard',
    text: '市場上已有 Magisterium、Apologist.ai、Bible.com 等成熟平台，「天好運」的核心差異化價值是什麼？為什麼這些功能組合是競品無法輕易複製的？',
  },
  {
    id: 8,
    category: '商業可行性',
    difficulty: 'easy',
    text: '文件估計運營三年的人力成本約 243,264 元/月，系統的收費模式是什麼？如果是免費使用，長期財務可持續性如何支撐？',
  },
  {
    id: 9,
    category: '倫理風險',
    difficulty: 'hard',
    text: 'SWOT 分析提到 AI 若產生偏差可能影響教徒信任。在宗教領域，若 AI 提供神學上錯誤的解答導致信徒誤導，系統的法律與道德責任如何界定？',
  },
  {
    id: 10,
    category: '系統限制',
    difficulty: 'mid',
    text: '「朝聖之地」使用 Google Maps Platform 計費制，請說明你們如何控管 API 呼叫成本？有沒有快取（caching）或節流（throttling）機制？',
  },
];

// ═══════════════════════════════════════════════════════
//  狀態
// ═══════════════════════════════════════════════════════
const state = {
  questions: [...PRESET_QUESTIONS],
  currentIdx: 0,
  answers: {},
  feedbacks: {},
  aiQuestion: null,
  loading: false,
  aiLoading: false,
  done: false,
};

// ═══════════════════════════════════════════════════════
//  Worker 呼叫（不需要 auth token）
// ═══════════════════════════════════════════════════════
async function callWorker(prompt) {
  const res = await fetch(WORKER_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contents: [{ parts: [{ text: prompt }] }]
    })
  });
  const data = await res.json();
  return data?.candidates?.[0]?.content?.parts?.[0]?.text || '（AI 未回應）';
}

// ═══════════════════════════════════════════════════════
//  AI 功能
// ═══════════════════════════════════════════════════════
async function getAIFeedback(question, answer) {
  const prompt = `${SYSTEM_CONTEXT}

以下是一位大三生對這道評審問題的練習回答，請給予具體、建設性的回饋（繁體中文，200字以內）：

【評審問題】
${question.text}

【學生回答】
${answer}

請從以下角度評估：
1. 回答是否抓到核心技術重點
2. 有哪些遺漏或可補強的面向
3. 給一個具體的改善建議

語氣像評審教授，簡潔直接。`;

  return await callWorker(prompt);
}

async function generateAIQuestion(category) {
  const prompt = `${SYSTEM_CONTEXT}

請針對「${category}」這個面向，產生一道全新的、具有挑戰性的口試問題（繁體中文）。
要求：
- 問題具體，不能太廣泛
- 針對這個專題的技術架構或設計決策
- 難度適中偏難
- 只輸出問題本身，不要其他說明`;

  return await callWorker(prompt);
}

// ═══════════════════════════════════════════════════════
//  渲染
// ═══════════════════════════════════════════════════════
function diffLabel(d) {
  return { hard: '難', mid: '中', easy: '易' }[d] || d;
}
function diffClass(d) {
  return { hard: 'diff-hard', mid: 'diff-mid', easy: 'diff-easy' }[d] || '';
}

function render() {
  const app = document.getElementById('app');
  if (state.done) { renderComplete(app); return; }

  const q = state.questions[state.currentIdx];
  const total = state.questions.length;
  const pct = Math.round((state.currentIdx / total) * 100);
  const currentAnswer = state.answers[q.id] || '';
  const feedback = state.feedbacks[q.id];

  app.innerHTML = `
    <div class="progress-bar">
      <div class="progress-track">
        <div class="progress-fill" style="width:${pct}%"></div>
      </div>
      <span class="progress-label">${state.currentIdx + 1} / ${total}</span>
    </div>

    <div class="question-card">
      <div class="q-meta">
        <span class="q-num">Q${q.id}</span>
        <span class="q-category">${q.category}</span>
        <span class="q-difficulty ${diffClass(q.difficulty)}">${diffLabel(q.difficulty)}</span>
      </div>
      <p class="q-text">${q.text}</p>
    </div>

    ${state.aiQuestion ? `
    <div class="ai-question-card">
      <div class="ai-badge">AI 追問</div>
      <p class="ai-q-text">${state.aiQuestion}</p>
    </div>` : ''}

    <div class="answer-area">
      <label>YOUR ANSWER</label>
      <textarea id="ans" placeholder="在此輸入你的回答…">${currentAnswer}</textarea>
    </div>

    <div class="btn-row">
      <button class="btn-primary" onclick="submitAnswer()">送出評分</button>
      <button class="btn-secondary" onclick="skipQuestion()">跳過此題</button>
      <button class="btn-secondary" onclick="generateAIQ()">✦ AI 追問</button>
      <button class="btn-ai" onclick="generateNewQuestion()">產生新題目</button>
    </div>

    ${state.loading ? `<div class="loading"><div class="spinner"></div>AI 評分中…</div>` : ''}
    ${state.aiLoading ? `<div class="loading"><div class="spinner"></div>AI 思考中…</div>` : ''}

    ${feedback ? `
    <div class="feedback-card">
      <div class="feedback-header">
        <div class="feedback-icon">★</div>
        <span class="feedback-label">PROFESSOR FEEDBACK</span>
      </div>
      <p class="feedback-text">${feedback}</p>
    </div>` : ''}

    <div class="nav-row">
      <button class="btn-secondary" onclick="prevQuestion()" ${state.currentIdx === 0 ? 'disabled style="opacity:0.4"' : ''}>← 上一題</button>
      <div class="nav-dots">
        ${state.questions.map((qq, i) => {
          let cls = '';
          if (i === state.currentIdx) cls = 'active';
          else if (state.answers[qq.id]) cls = 'done';
          return `<div class="dot ${cls}" onclick="goTo(${i})" title="Q${qq.id}"></div>`;
        }).join('')}
      </div>
      <button class="btn-secondary" onclick="nextQuestion()">${state.currentIdx === total - 1 ? '完成 ✓' : '下一題 →'}</button>
    </div>
  `;

  document.getElementById('ans')?.addEventListener('input', e => {
    state.answers[q.id] = e.target.value;
  });
}

function renderComplete(app) {
  const answered = Object.keys(state.answers).filter(k => state.answers[k]).length;
  app.innerHTML = `
    <div class="complete-screen">
      <div class="complete-icon">🕊</div>
      <h2>練習完成</h2>
      <p>共完成 ${answered} / ${state.questions.length} 題回答</p>
      <button class="btn-primary" onclick="restart()">重新練習</button>
    </div>
  `;
}

// ═══════════════════════════════════════════════════════
//  事件
// ═══════════════════════════════════════════════════════
async function submitAnswer() {
  const q = state.questions[state.currentIdx];
  const answer = document.getElementById('ans')?.value?.trim();
  if (!answer) { alert('請先輸入你的回答'); return; }
  state.answers[q.id] = answer;
  state.loading = true;
  render();
  try {
    state.feedbacks[q.id] = await getAIFeedback(q, answer);
  } catch (e) {
    state.feedbacks[q.id] = '（AI 暫時無法回應，請稍後再試）';
  }
  state.loading = false;
  render();
}

async function generateAIQ() {
  const q = state.questions[state.currentIdx];
  state.aiLoading = true;
  state.aiQuestion = null;
  render();
  try {
    state.aiQuestion = await generateAIQuestion(q.category);
  } catch (e) {
    state.aiQuestion = '（AI 暫時無法產生追問）';
  }
  state.aiLoading = false;
  render();
}

async function generateNewQuestion() {
  const categories = ['系統定位', 'AI 技術', '資料庫設計', '資訊安全', '需求規格', '商業可行性', '倫理風險'];
  const cat = categories[Math.floor(Math.random() * categories.length)];
  state.aiLoading = true;
  render();
  try {
    const text = await generateAIQuestion(cat);
    const newQ = {
      id: Date.now(),
      category: cat,
      difficulty: 'mid',
      text,
    };
    state.questions.push(newQ);
    state.currentIdx = state.questions.length - 1;
    state.aiQuestion = null;
  } catch (e) {
    alert('AI 暫時無法產生新題目');
  }
  state.aiLoading = false;
  render();
}

function skipQuestion() {
  state.aiQuestion = null;
  nextQuestion();
}

function nextQuestion() {
  state.aiQuestion = null;
  if (state.currentIdx < state.questions.length - 1) {
    state.currentIdx++;
    render();
  } else {
    state.done = true;
    render();
  }
}

function prevQuestion() {
  state.aiQuestion = null;
  if (state.currentIdx > 0) {
    state.currentIdx--;
    render();
  }
}

function goTo(i) {
  state.aiQuestion = null;
  state.currentIdx = i;
  render();
}

function restart() {
  Object.assign(state, {
    questions: [...PRESET_QUESTIONS],
    currentIdx: 0,
    answers: {},
    feedbacks: {},
    aiQuestion: null,
    loading: false,
    aiLoading: false,
    done: false,
  });
  render();
}

// ── 啟動 ──
render();
</script>
</body>
</html>
